name: Budowa Aplikacji APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    
    - name: Ustawienie środowiska Java
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: Budowanie pliku APK
      run: |
        chmod +x ./gradlew
        ./gradlew assembleDebug
        
    - name: Udostępnienie pliku APK do pobrania
      uses: actions/upload-artifact@v3
      with:
        name: Aplikacja-Logistyka-UR
        path: app/build/outputs/apk/debug/app-debug.apk
